services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unmix
      POSTGRES_PASSWORD: unmix
      POSTGRES_DB: unmix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unmix"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      UNMIX_DATABASE_URL: postgresql+psycopg2://unmix:unmix@postgres:5432/unmix
      UNMIX_OBJECT_STORE: minio
      UNMIX_MINIO_ENDPOINT: minio:9000
      UNMIX_MINIO_ACCESS_KEY: minioadmin
      UNMIX_MINIO_SECRET_KEY: minioadmin
      UNMIX_CELERY_BROKER_URL: redis://redis:6379/0
      UNMIX_CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=4
    environment:
      UNMIX_DATABASE_URL: postgresql+psycopg2://unmix:unmix@postgres:5432/unmix
      UNMIX_OBJECT_STORE: minio
      UNMIX_MINIO_ENDPOINT: minio:9000
      UNMIX_MINIO_ACCESS_KEY: minioadmin
      UNMIX_MINIO_SECRET_KEY: minioadmin
      UNMIX_CELERY_BROKER_URL: redis://redis:6379/0
      UNMIX_CELERY_RESULT_BACKEND: redis://redis:639/1
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
