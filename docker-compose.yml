services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unmix
      POSTGRES_PASSWORD: unmix
      POSTGRES_DB: unmix
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unmix"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-09-51Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: unmix
      MINIO_ROOT_PASSWORD: unmix-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  backend:
    build: ./backend
    depends_on: [postgres, redis, minio]
    environment:
      UNMIX_DATABASE_URL: postgresql+psycopg://unmix:unmix@postgres:5432/unmix
      UNMIX_REDIS_URL: redis://redis:6379/0
      UNMIX_MINIO_ENDPOINT: minio:9000
      UNMIX_MINIO_ACCESS_KEY: unmix
      UNMIX_MINIO_SECRET_KEY: unmix-dev-secret
      UNMIX_JWT_SECRET: change-me-in-production
    ports: ["8000:8000"]

  worker:
    build: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=INFO --concurrency=4
    depends_on: [backend, redis, minio, postgres]
    environment:
      UNMIX_DATABASE_URL: postgresql+psycopg://unmix:unmix@postgres:5432/unmix
      UNMIX_REDIS_URL: redis://redis:6379/0
      UNMIX_MINIO_ENDPOINT: minio:9000
      UNMIX_MINIO_ACCESS_KEY: unmix
      UNMIX_MINIO_SECRET_KEY: unmix-dev-secret
      UNMIX_JWT_SECRET: change-me-in-production

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
  miniodata:
