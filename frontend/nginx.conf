server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API + tile pyramid proxied same-origin (so cached tile URLs never need
    # credentials in the query string). Tile responses are marked immutable;
    # the pinned image+matrix+algorithm+generation URL namespace means a matrix
    # revision atomically invalidates browser cache, tile store and reports.
    location ~ ^/(images|matrices|control-samples|jobs|viewer|results|users|audit|me|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
